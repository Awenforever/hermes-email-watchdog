name: hermes-email-watchdog
version: 0.14.1
manifest_version: 1
api_version: 1
description: Read-only email triage with grounded classification and actionable messaging alerts.
author: Awenforever
license: MIT
homepage: https://github.com/Awenforever/hermes-email-watchdog
tags: [email, imap, triage, gateway]
requires_hermes: ">=0.21.3,<0.22"
# Windows CPython ships no system tz database, so zoneinfo needs the tzdata
# package to resolve non-Beijing profile timezones (e.g. Europe/Berlin). Hermes
# surfaces this as an install hint and never auto-installs plugin dependencies,
# so Windows users pip-install tzdata for correct local-time deadlines; without
# it the code degrades to a fixed offset. Linux/macOS/WSL2/Docker have a system
# tz database and need nothing.
python_dependencies:
  - "tzdata>=2024.1; sys_platform == 'win32'"
config_schema:
  enabled:
    type: bool
    default: false
    description: Enable read-only mailbox polling after account setup.
  interval_seconds:
    type: int
    default: 60
    description: Mailbox polling interval.
  notification_policy:
    type: str
    default: actionable
    description: Push actionable mail only; other mail stays silent and auditable.
  weekly_report_notifications:
    type: bool
    default: true
    description: Notify when a Weekly Report email arrives.
  semantic_provider:
    type: str
    default: hermes
    description: Use Hermes' provider router and credential store.
  semantic_model:
    type: str
    default: ""
    description: Optional Hermes model alias; empty inherits the active primary model.
  semantic_fallback_model:
    type: str
    default: ""
    description: Optional Hermes model alias; empty inherits Hermes fallback routing.
  auto_download_attachments:
    type: bool
    default: true
    description: Download model-selected useful attachments without mutating mailbox state.
  forward_attachments:
    type: bool
    default: true
    description: Forward safe bounded downloaded attachments with their notification.
  notification_renderer:
    type: str
    default: intelligent_v2
    description: Compact mobile notification renderer.
  create_reminders:
    type: bool
    default: true
    description: Persist actionable deadlines and create 24-hour and 1-hour reminders.
  managed_reminder_scheduler:
    type: bool
    default: true
    description: Deliver due reminders through the plugin's portable scheduler.
