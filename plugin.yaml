name: hermes-email-watchdog
version: 0.6.0
manifest_version: 1
api_version: 1
description: Read-only email triage with grounded classification and actionable messaging alerts.
author: Awenforever
license: MIT
homepage: https://github.com/Awenforever/hermes-email-watchdog
tags: [email, imap, triage, gateway]
requires_hermes: ">=0.21.3,<0.22"
config_schema:
  enabled:
    type: bool
    default: false
    description: Enable read-only mailbox polling after account setup.
  interval_seconds:
    type: int
    default: 60
    description: Mailbox polling interval.
  notification_policy:
    type: str
    default: actionable
    description: Push actionable mail only; other mail stays silent and auditable.
  weekly_report_notifications:
    type: bool
    default: true
    description: Notify when a Weekly Report email arrives.
  semantic_provider:
    type: str
    default: USTC
    description: Hermes OpenAI-compatible provider used for semantic analysis.
  semantic_model:
    type: str
    default: deepseek-flash
    description: Model used for grounded classification and formatting.
  semantic_fallback_model:
    type: str
    default: qwen3.8-chat
    description: Fallback used when the primary model fails or cannot produce a grounded schema.
  auto_download_attachments:
    type: bool
    default: true
    description: Download model-selected useful attachments without mutating mailbox state.
  forward_attachments_to_weixin:
    type: bool
    default: true
    description: Forward safe bounded downloaded attachments with their notification.
  notification_renderer:
    type: str
    default: intelligent_v2
    description: Compact mobile notification renderer.
  create_reminders:
    type: bool
    default: true
    description: Persist actionable deadlines and create 24-hour and 1-hour reminders.
  managed_reminder_scheduler:
    type: bool
    default: true
    description: Deliver due reminders through the plugin's portable scheduler.
