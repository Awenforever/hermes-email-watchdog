name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run repository matrix
        run: bash scripts/ci.sh
      - name: Run lifecycle matrix
        run: bash tests/test_repository_lifecycle.sh "$GITHUB_WORKSPACE"

  windows-suite:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows CPython ships no system tz database, so exercise both states of
        # the declared tzdata dependency (plugin.yaml python_dependencies):
        #   absent  -> proves the zoneinfo fixed-offset fallbacks still render
        #              Beijing dates correctly with no tz database, and that a
        #              non-Beijing profile timezone skips instead of failing.
        #   present -> proves Europe/Berlin resolves to its real offset (+01:00)
        #              once the declared dependency is installed.
        tzdata: ["absent", "present"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install declared tzdata dependency
        if: matrix.tzdata == 'present'
        run: python -m pip install "tzdata>=2024.1"
      - name: Run test suite on native Windows Python
        run: python tests/run_suite.py
